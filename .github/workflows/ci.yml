name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Actions tab → CI → "Run workflow": build, test and publish a release (creates the tag) without using git.
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0 (leave empty to only build and test)"
        required: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key (optional repository secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ICS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ics.jks"
            echo "ICS_KEYSTORE_FILE=$RUNNER_TEMP/ics.jks" >> "$GITHUB_ENV"
            echo "Signing with the stable key: published APKs update in place."
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '') }}" = "true" ]; then
            echo "::error::Releases must be signed with the permanent key: add the ICS_KEYSTORE_B64, ICS_KEYSTORE_PASSWORD and ICS_KEY_ALIAS repository secrets."
            exit 1
          else
            echo "::warning::No ICS_KEYSTORE_B64 secret: the APK is signed with a temporary key, so later versions can't install over it."
          fi
      - name: Unit, smoke and screenshot tests, lint, build APK
        env:
          ICS_KEYSTORE_PASSWORD: ${{ secrets.ICS_KEYSTORE_PASSWORD }}
          ICS_KEY_ALIAS: ${{ secrets.ICS_KEY_ALIAS }}
        run: ./gradlew :app:testDebugUnitTest :app:verifyPaparazziDebug :app:lintDebug :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: immcloudscale-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: immcloudscale-release-apk
          path: app/build/outputs/apk/release/app-release.apk

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Vet and test
        run: go vet ./... && go test ./...
      - name: Build .deb packages (amd64, arm64)
        run: ./deploy/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: immcloudscale-server-debs
          path: server/dist/*.deb

  release:
    # Tag v<version> (e.g. v0.1.0), or run the workflow by hand with a version, to publish the APK and server packages.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [android, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: immcloudscale-server-debs
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: immcloudscale-release-apk
          path: dist
      - name: Name the APK
        run: mv dist/app-release.apk "dist/ImmCloudScale-${TAG#v}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ImmCloudScale ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.apk
